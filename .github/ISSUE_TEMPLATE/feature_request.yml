name: ✨ Feature request
description: Propose an improvement or new content for the site
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What user or business need does this address?
      placeholder: Guests often ask …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should we build? Include pages, components, or API changes if relevant.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend UI/UX
        - Content / pages
        - Translations (en/ar/fr/es)
        - Supabase / forms
        - Performance / images
        - CI / DevOps
        - Backend (ASP.NET — planned)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
